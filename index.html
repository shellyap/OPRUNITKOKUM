        // TIME FORMATTER

            if (!time) return '';
            const [h, m] = time.split(':');
            const hour = parseInt(h);
            let suffix = 'PG';
            if (hour >= 12) {
                if (hour >= 19) suffix = 'MLM';
                else if (hour >= 14) suffix = 'PTG';
                else suffix = 'TGH';
            }
            const h12 = hour % 12 || 12;
            return `${h12}:${m} ${suffix}`;
        };

            const currentSelection = Array.isArray(selectedValues) ? selectedValues : [];

            const availableOptions = options.filter(opt => 
                !currentSelection.includes(opt) && 
                opt.toLowerCase().includes(search.toLowerCase())
            );

            const removeValue = (val) => {
                onChange(currentSelection.filter(v => v !== val));
            };

            const addValue = (val) => {
                onChange([...currentSelection, val]);
                setSearch('');
            };

            return (
                <div className="relative" ref={wrapperRef}>
                    <div 
                        className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-2 min-h-[56px] flex flex-wrap gap-2 items-center cursor-text hover:border-indigo-300 transition-colors pr-8"
                        onClick={() => setIsOpen(true)}
                    >
                        {currentSelection.map(val => (
                            <span key={val} className="bg-indigo-100 border border-indigo-200 text-indigo-700 text-[10px] px-2 py-1 rounded-full font-bold flex items-center gap-1 animate-in zoom-in-50">
                                {val}
                                <button onClick={(e) => { e.stopPropagation(); removeValue(val); }} className="hover:text-indigo-900 bg-indigo-200 rounded-full p-0.5"><X size={8} /></button>
                            </span>
                        ))}
                        <input 
                            type="text"
                            className="bg-transparent outline-none text-sm font-bold flex-grow min-w-[100px] p-2 placeholder:font-normal placeholder:text-gray-400"
                            placeholder={currentSelection.length === 0 ? placeholder : ""}
                            value={search}
                            onChange={(e) => { setSearch(e.target.value); setIsOpen(true); }}
                            onFocus={() => setIsOpen(true)}
                        />
                        <ChevronDown size={16} className={`absolute right-4 text-slate-400 transform transition-transform ${isOpen ? 'rotate-180' : 'rotate-0'}`} />
                    </div>

                    {isOpen && (
                        <div className="absolute top-full left-0 w-full z-30 bg-white border-2 border-slate-200 rounded-xl shadow-xl mt-2 overflow-hidden animate-in fade-in zoom-in-95 duration-100">
                            <div className="max-h-60 overflow-y-auto scrollbar-hide">
                                {availableOptions.length > 0 ? (
                                    availableOptions.map((opt, i) => (
                                        <div 
                                            key={i} 
                                            className="p-3 hover:bg-indigo-50 cursor-pointer text-xs font-bold text-slate-600 flex items-center gap-2"
                                            onClick={() => addValue(opt)}
                                        >
                                            <div className="w-4 h-4 rounded border border-slate-300 flex items-center justify-center"></div>
                                            {opt}
                                        </div>
                                    ))
                                ) : (
                                    <div className="p-4 text-xs text-gray-400 text-center">
                                        {options.length === currentSelection.length ? "Semua nama dipilih" : "Tiada nama dijumpai"}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('editor');
            const [reportType, setReportType] = useState('program'); 
            const [formData, setFormData] = useState(INITIAL_FORM);
            const [images, setImages] = useState([null, null, null, null]);
            const [logo, setLogo] = useState(null);
            const [reports, setReports] = useState([]);
            const [viewingReport, setViewingReport] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [isDownloading, setIsDownloading] = useState(false);
            const [archiveFilter, setArchiveFilter] = useState('UNIT BERUNIFORM');
            const [archiveUnitFilter, setArchiveUnitFilter] = useState('ALL'); 
            const [archiveReportType, setArchiveReportType] = useState('program'); 
            const [statusMsg, setStatusMsg] = useState(null);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'unitko-opr-smkms';

            const getMeetingStats = (unitName) => {
                const count = reports.filter(r => r.type === 'weekly' && r.unitNama === unitName).length;
                return { count, percent: Math.min(100, Math.round((count / 12) * 100)) };
            };

            useEffect(() => {
                const checkSDK = setInterval(() => {
                    if (window.FirebaseSDK) {
                        clearInterval(checkSDK);
                        initFirebase();
                    }
                }, 100);
                return () => clearInterval(checkSDK);
            }, []);

            useEffect(() => {
                if (reportType === 'weekly' && !formData.unitNama) {
                     const firstUnit = UNIT_DATA[formData.kategori]?.[0] || '';
                     setFormData(prev => ({ ...prev, unitNama: firstUnit }));
                }
            }, [formData.kategori, reportType]);

            const initFirebase = async () => {
                const { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken, getFirestore } = window.FirebaseSDK;
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : DEFAULT_CONFIG;
                
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (e) {
                        console.error("Token auth failed, falling back to anon", e);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) setupSync(db);
                });
            };

            const setupSync = (db) => {
                const { collection, onSnapshot, query, doc } = window.FirebaseSDK;
                const reportsCol = collection(db, 'artifacts', appId, 'public', 'data', 'reports');
                onSnapshot(query(reportsCol), (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setReports(data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                }, (err) => console.error("Reports Sync Error:", err));

                const settingsDoc = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_config');
                onSnapshot(settingsDoc, (snap) => {
                    if (snap.exists() && snap.data().logo) setLogo(snap.data().logo);
                });
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: value };
                    if (name === 'kategori' && prev.type === 'weekly') {
                        newData.unitNama = UNIT_DATA[value]?.[0] || '';
                    }
                    return newData;
                });
            };

            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800; 
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                        };
                    };
                });
            };

            const handleLogoUpload = async (e) => {
                const file = e.target.files[0];
                if (file && user) {
                    showStatus("Compressing & Uploading...");
                    try {
                        const base64 = await compressImage(file);
                        setLogo(base64);
                        const { getFirestore, doc, setDoc } = window.FirebaseSDK;
                        const db = getFirestore();
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global_config'), { logo: base64 }, { merge: true });
                        showStatus("School Logo updated globally");
                    } catch (error) {
                        if (error.code === 'permission-denied') {
                            showStatus("Access Denied: Please add your own Firebase keys to the code.", "error");
                        } else {
                            showStatus("Error uploading logo", "error");
                        }
                    }
                }
            };

            const handleImageUpload = async (index, e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const compressedBase64 = await compressImage(file);
                        const newImages = [...images];
                        newImages[index] = compressedBase64;
                        setImages(newImages);
                    } catch (error) {
                        console.error("Compression error", error);
                        showStatus("Failed to process image", "error");
                    }
                }
            };

            const saveReport = async () => {
                if (!formData.tarikh) return showStatus("Sila masukkan Tarikh", "error");
                if (formData.type === 'program' && !formData.namaProgram) return showStatus("Sila masukkan Nama Program", "error");
                if (formData.type === 'weekly' && !formData.unitNama) return showStatus("Sila pilih Unit", "error");

                setIsSaving(true);
                const { getFirestore, collection, addDoc, serverTimestamp } = window.FirebaseSDK;
                const db = getFirestore();
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), {
                        ...formData, 
                        type: reportType, 
                        images, 
                        createdAt: serverTimestamp(), 
                        userId: user.uid
                    });
                    showStatus("Laporan Berjaya Disimpan di Awan");
                    setFormData(INITIAL_FORM);
                    setImages([null, null, null, null]);
                    setActiveTab('archive');
                } catch (e) { 
                    if (e.code === 'permission-denied') {
                         showStatus("PERMISSION DENIED: Go to Firebase Console > Firestore Database > Rules and change 'allow write: if false' to 'true'.", "error");
                    } else {
                        showStatus("Error: " + e.message, "error"); 
                    }
                }
                setIsSaving(false);
            };

            const deleteReport = async (id) => {
                if (!confirm("Padam laporan ini dari awan?")) return;
                const { getFirestore, doc, deleteDoc } = window.FirebaseSDK;
                const db = getFirestore();
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', id));
                    showStatus("Berjaya Dipadam");
                } catch (err) { 
                    if (err.code === 'permission-denied') {
                         showStatus("PERMISSION DENIED: Go to Firebase Console > Firestore Database > Rules and change 'allow write: if false' to 'true'.", "error");
                    } else {
                        showStatus("Gagal memadam.", "error"); 
                    }
                }
            };

            const downloadAsJPG = async () => {
                if (!window.html2canvas) return alert("System busy...");
                setIsDownloading(true);
                try {
                    const el = document.getElementById('print-area');
                    const originalOpacity = el.style.opacity;
                    el.style.opacity = '1';

                    const canvas = await window.html2canvas(el, { 
                        scale: 2, 
                        useCORS: true, 
                        allowTaint: true,
                        backgroundColor: "#ffffff",
                        logging: false,
                        width: 794, 
                        height: 1123,
                        windowWidth: 1200, 
                    });

                    el.style.opacity = originalOpacity;

                    const title = reportType === 'program' ? (formData.namaProgram || "OPR") : (formData.unitNama || "Laporan Mingguan");

                    const link = document.createElement('a');
                    link.download = `${title}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                    showStatus("Imej Disimpan");
                } catch (e) { 
                    console.error(e);
                    showStatus("Download failed: " + e.message, "error"); 
                }
                setIsDownloading(false);
            };

            const showStatus = (msg, type = 'success') => {
                setStatusMsg({ text: msg, type });
                setTimeout(() => setStatusMsg(null), 4000);
            };

            // --- Renamed from ReportDocument to avoid clash ---
            const ProgramReportDocument = ({ data, reportImages, schoolLogo }) => {
                const cat = CATEGORIES.find(c => c.id === data.kategori) || CATEGORIES[0];
                return (
                    <div className="a4-page shadow-2xl">
                        <div className={`border-[3px] border-double ${cat.border} h-full flex flex-col p-5 overflow-hidden`}>
                            {/* Header */}
                            <div className={`flex border-b-2 ${cat.border} pb-2 mb-2 items-center flex-shrink-0`}>
                                <div className="w-14 h-14 flex-shrink-0 flex items-center justify-center mr-3">
                                    {schoolLogo ? <img src={schoolLogo} className="max-w-full max-h-full object-contain filter contrast-125" /> : <School size={35} className="text-gray-200" />}
                                </div>
                                <div className="flex-grow text-center">
                                    <h1 className="text-md font-bold uppercase tracking-tight" style={{fontFamily: 'Times New Roman'}}>SMK Mat Salleh Ranau</h1>
                                    <h2 className={`text-xs font-bold uppercase ${cat.text}`}>Unit Ko-Kurikulum</h2>
                                    <div className={`border-t ${cat.border} w-20 mx-auto my-0.5`}></div>
                                    <p className="text-[9px] font-bold uppercase tracking-widest opacity-80">{cat.label}</p>
                                </div>
                                <div className="w-14"></div>
                            </div>
                            
                            <div className={`${cat.bg} border ${cat.border} p-2 text-center mb-2 flex-shrink-0`}>
                                <h3 className={`text-xs font-extrabold uppercase line-clamp-1 ${cat.text}`}>{data.namaProgram || "LAPORAN PROGRAM / AKTIVITI"}</h3>
                                <p className="text-[8px] font-bold italic uppercase opacity-60">Anjuran: {data.anjuran || "-"}</p>
                            </div>
                            
                            <div className={`grid grid-cols-2 border-t border-l ${cat.border} text-[9px] mb-2 flex-shrink-0`}>
                                <div className={`border-r border-b ${cat.border} p-1 flex items-center`}><span className={`font-bold w-14 ${cat.text}`}>TARIKH</span>: {data.tarikh || "-"}</div>
                                <div className={`border-r border-b ${cat.border} p-1 flex items-center`}><span className={`font-bold w-14 ${cat.text}`}>TEMPAT</span>: {data.tempat || "-"}</div>
                                <div className={`border-r border-b ${cat.border} p-1 flex items-center`}><span className={`font-bold w-14 ${cat.text}`}>MASA</span>: {data.masaMula ? `${formatTimeBM(data.masaMula)} - ${formatTimeBM(data.masaTamat)}` : "-"}</div>
                                <div className={`border-r border-b ${cat.border} p-1 flex items-center`}><span className={`font-bold w-14 ${cat.text}`}>SASARAN</span>: {data.sasaran || "-"}</div>
                            </div>

                            <div className="space-y-2 flex-grow overflow-hidden flex flex-col">
                                <div className={`border ${cat.border} flex-shrink-0 flex flex-col min-h-[10%] overflow-hidden`}>
                                    <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[8px] font-bold uppercase ${cat.text}`}>I. Objektif Program</div>
                                    <div className="p-1.5 text-[10px] text-justify line-clamp-3">{data.objektif || "-"}</div>
                                </div>
                                <div className={`border ${cat.border} flex-shrink-0 flex flex-col min-h-[15%] overflow-hidden`}>
                                    <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[8px] font-bold uppercase ${cat.text}`}>II. Ringkasan Aktiviti</div>
                                    <div className="p-1.5 text-[10px] text-justify line-clamp-6">{data.aktiviti || "-"}</div>
                                </div>
                                <div className={`grid grid-cols-2 border ${cat.border} flex-shrink-0 min-h-[10%] overflow-hidden`}>
                                    <div className={`border-r ${cat.border} flex flex-col`}>
                                        <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[8px] font-bold uppercase text-center ${cat.text}`}>III. Kekuatan</div>
                                        <div className="p-1.5 text-[10px] line-clamp-3 text-center">{data.kekuatan || "-"}</div>
                                    </div>
                                    <div className="flex flex-col">
                                        <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[8px] font-bold uppercase text-center ${cat.text}`}>IV. Kelemahan / Cadangan</div>
                                        <div className="p-1.5 text-[10px] line-clamp-3 text-center">{data.kelemahan || "-"}</div>
                                    </div>
                                </div>
                                <div className={`border ${cat.border} flex-grow flex flex-col overflow-hidden`}>
                                    <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[8px] font-bold uppercase text-center ${cat.text}`}>V. Laporan Bergambar</div>
                                    <div className="grid grid-cols-2 grid-rows-2 gap-1.5 p-1.5 bg-gray-50 flex-grow overflow-hidden">
                                        {reportImages.map((img, i) => (
                                            <div key={i} className="bg-white border border-gray-200 flex items-center justify-center overflow-hidden h-full">
                                                {img ? <img src={img} className="w-full h-full object-contain" /> : <p className="text-[7px] text-gray-300 italic">Ruang Foto {i+1}</p>}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className={`mt-3 pt-3 grid grid-cols-2 gap-16 text-[10px] flex-shrink-0 border-t ${cat.border}`}>
                                <div className="text-center">
                                    <p className="mb-8 font-medium uppercase">Disediakan Oleh:</p>
                                    <div className={`border-b ${cat.border} w-full mx-auto font-bold uppercase pb-0.5`}>{data.disediakanOleh || "................................"}</div>
                                    <p className="text-[7px] mt-0.5 font-bold opacity-60">PENYELARAS PROGRAM / SETIAUSAHA</p>
                                </div>
                                <div className="text-center">
                                    <p className="mb-8 font-medium uppercase">Disahkan Oleh:</p>
                                    <div className={`border-b ${cat.border} w-full mx-auto font-bold pb-0.5`}>................................</div>
                                    <p className="text-[7px] mt-0.5 font-bold opacity-60">PK KOKUM / PENGETUA</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const WeeklyReportDocument = ({ data, reportImages, schoolLogo }) => {
                const cat = CATEGORIES.find(c => c.id === data.kategori) || CATEGORIES[0];
                
                // Calculate Percentage for Display
                const percentage = data.kehadiranHadir && data.kehadiranJumlah 
                    ? Math.round((data.kehadiranHadir / data.kehadiranJumlah) * 100) 
                    : 0;

                // CALCULATE MEETING NUMBER (Perjumpaan Ke-X)
                let meetingNumber = 1;
                if (data.unitNama) {
                    // Get all weekly reports for this unit
                    const unitReports = reports.filter(r => r.type === 'weekly' && r.unitNama === data.unitNama);
                    
                    if (data.id) {
                        // If viewing an archived report, find its position based on Date
                        // Sort by date ascending to ensure chronological order numbering
                        const sorted = [...unitReports].sort((a, b) => new Date(a.tarikh) - new Date(b.tarikh));
                        const index = sorted.findIndex(r => r.id === data.id);
                        if (index !== -1) meetingNumber = index + 1;
                    } else {
                        // If previewing a new report (no ID yet)
                        // Assume it is the next one.
                        meetingNumber = unitReports.length + 1;
                    }
                }

                return (
                    <div className="a4-page shadow-2xl">
                        <div className={`border-[3px] border-double ${cat.border} h-full flex flex-col p-5 overflow-hidden`}>
                            {/* Header */}
                            <div className={`flex border-b-2 ${cat.border} pb-2 mb-2 items-center flex-shrink-0`}>
                                <div className="w-14 h-14 flex-shrink-0 flex items-center justify-center mr-3">
                                    {schoolLogo ? <img src={schoolLogo} className="max-w-full max-h-full object-contain filter contrast-125" /> : <School size={35} className="text-gray-200" />}
                                </div>
                                <div className="flex-grow text-center">
                                    <h1 className="text-md font-bold uppercase tracking-tight" style={{fontFamily: 'Times New Roman'}}>SMK Mat Salleh Ranau</h1>
                                    <h2 className={`text-xs font-bold uppercase ${cat.text}`}>Laporan Perjumpaan Mingguan</h2>
                                    <div className={`border-t ${cat.border} w-20 mx-auto my-0.5`}></div>
                                    <p className="text-[9px] font-bold uppercase tracking-widest opacity-80">{cat.label}</p>
                                </div>
                                <div className="w-14"></div>
                            </div>
                            
                            {/* Title Block with Meeting Record */}
                            <div className={`${cat.bg} border ${cat.border} p-2 text-center mb-4 flex-shrink-0`}>
                                <h3 className={`text-sm font-extrabold uppercase line-clamp-1 ${cat.text}`}>{data.unitNama || "NAMA UNIT"}</h3>
                                <div className={`inline-block border-t-2 ${cat.border} mt-1 pt-1 px-4 border-dotted`}>
                                    <p className={`text-[10px] font-black uppercase ${cat.text} tracking-widest`}>
                                        LAPORAN PERJUMPAAN KE-{meetingNumber}
                                    </p>
                                </div>
                            </div>

                            {/* Section A: Maklumat */}
                            <div className={`border ${cat.border} mb-3 flex-shrink-0`}>
                                <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[9px] font-bold uppercase ${cat.text}`}>A. Maklumat Perjumpaan</div>
                                <div className="grid grid-cols-2 text-[9px] p-2 gap-y-1">
                                    <div className="flex"><span className="font-bold w-20">Tarikh</span>: {data.tarikh}</div>
                                    <div className="flex"><span className="font-bold w-20">Masa</span>: {data.masaMula ? `${formatTimeBM(data.masaMula)} - ${formatTimeBM(data.masaTamat)}` : "-"}</div>
                                    <div className="flex"><span className="font-bold w-20">Tempat</span>: {data.tempat}</div>
                                    <div className="flex"><span className="font-bold w-20">Kehadiran</span>: {data.kehadiranHadir || "__"} / {data.kehadiranJumlah || "__"} ({percentage}%)</div>
                                    <div className="col-span-2 flex mt-1"><span className="font-bold w-20">Guru Penasihat</span>: {data.guruPenasihat}</div>
                                    {data.guruBertugas && data.guruBertugas.length > 0 && (
                                        <div className="col-span-2 flex mt-1"><span className="font-bold w-20">Guru Bertugas</span>: {Array.isArray(data.guruBertugas) ? data.guruBertugas.join(', ') : data.guruBertugas}</div>
                                    )}
                                </div>
                            </div>

                            {/* Section B: Objektif */}
                            <div className={`border ${cat.border} mb-3 flex-shrink-0`}>
                                <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[9px] font-bold uppercase ${cat.text}`}>B. Objektif & Nilai</div>
                                <div className="p-2 text-[9px] space-y-2">
                                    <div>
                                        <span className="font-bold block mb-0.5">Objektif Perjumpaan:</span>
                                        <p className="text-justify">{data.objektif || "-"}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold block mb-0.5">Kemahiran / Nilai Diterapkan:</span>
                                        <p className="text-justify">{data.kemahiranNilai || "-"}</p>
                                    </div>
                                </div>
                            </div>

                            {/* Section C: Aktiviti */}
                            <div className={`border ${cat.border} mb-3 flex-shrink-0 min-h-[100px]`}>
                                <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[9px] font-bold uppercase ${cat.text}`}>C. Aktiviti Dilaksanakan</div>
                                <div className="p-2 text-[9px] text-justify whitespace-pre-wrap">
                                    {data.aktiviti || "-"}
                                </div>
                            </div>

                            {/* Section Photos */}
                             <div className={`border ${cat.border} flex-grow flex flex-col overflow-hidden mb-3`}>
                                <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[9px] font-bold uppercase text-center ${cat.text}`}>Laporan Bergambar</div>
                                <div className="grid grid-cols-2 grid-rows-2 gap-1.5 p-1.5 bg-gray-50 flex-grow overflow-hidden">
                                    {reportImages.map((img, i) => (
                                        <div key={i} className="bg-white border border-gray-200 flex items-center justify-center overflow-hidden h-full">
                                            {img ? <img src={img} className="w-full h-full object-contain" /> : <p className="text-[7px] text-gray-300 italic">Ruang Foto {i+1}</p>}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Section G: Refleksi */}
                            <div className={`border ${cat.border} mb-3 flex-shrink-0`}>
                                <div className={`${cat.bg} border-b ${cat.border} p-1 px-2 text-[9px] font-bold uppercase ${cat.text}`}>G. Refleksi Guru Penasihat</div>
                                <div className="p-2 text-[9px] text-justify">
                                    <p className="italic opacity-70 mb-1">(Kekuatan perjumpaan dan perkara perlu penambahbaikan)</p>
                                    {data.refleksi || "-"}
                                </div>
                            </div>

                            {/* Signatures */}
                            <div className={`mt-1 pt-2 grid grid-cols-2 gap-16 text-[9px] flex-shrink-0 border-t ${cat.border}`}>
                                <div className="text-center">
                                    <p className="mb-6 font-medium uppercase">Disediakan Oleh:</p>
                                    <div className={`border-b ${cat.border} w-full mx-auto font-bold uppercase pb-0.5`}>{data.guruPenasihat || "................................"}</div>
                                    <p className="text-[7px] mt-0.5 font-bold opacity-60">GURU PENASIHAT</p>
                                </div>
                                <div className="text-center">
                                    <p className="mb-6 font-medium uppercase">Disahkan Oleh:</p>
                                    <div className={`border-b ${cat.border} w-full mx-auto font-bold pb-0.5`}>................................</div>
                                    <p className="text-[7px] mt-0.5 font-bold opacity-60">PK KOKUM / PENGETUA</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const ReportDocument = (props) => {
                const type = props.data.type || 'program';
                if (type === 'weekly') {
                    return <WeeklyReportDocument {...props} />;
                }
                return <ProgramReportDocument {...props} />;
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <div id="root-ui" className="flex flex-col flex-grow">
                        <nav className="bg-slate-900 text-white px-6 py-4 sticky top-0 z-50 shadow-xl border-b border-slate-800">
                            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                                <div className="flex items-center gap-4">
                                    <div className="bg-indigo-600 p-2.5 rounded-2xl shadow-lg ring-1 ring-white/20"><Sparkles size={26} className="text-white" /></div>
                                    <div>
                                        <h1 className="text-xl font-black uppercase text-indigo-100 leading-none">OPR UNIT KO-KURIKULUM</h1>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">SMK MAT SALLEH RANAU</p>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <div className="flex bg-slate-800 p-1 rounded-2xl border border-slate-700">
                                        <button onClick={() => {setReportType('program'); setActiveTab('editor'); setViewingReport(null); setFormData(prev => ({...INITIAL_FORM, type: 'program'}));}} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all ${reportType === 'program' && activeTab === 'editor' ? 'bg-indigo-500 text-white' : 'text-slate-400 hover:text-white'}`}>Laporan Program</button>
                                        <button onClick={() => {setReportType('weekly'); setActiveTab('editor'); setViewingReport(null); setFormData(prev => ({...INITIAL_FORM, type: 'weekly'}));}} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all ${reportType === 'weekly' && activeTab === 'editor' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Laporan Mingguan</button>
                                    </div>
                                    <button onClick={() => {setActiveTab('archive'); setViewingReport(null)}} className={`px-6 py-2 rounded-2xl text-[10px] font-black uppercase transition-all border border-slate-700 ${activeTab === 'archive' ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>Arkib</button>
                                </div>
                                <div className={`flex items-center gap-2 px-4 py-1.5 rounded-full text-[10px] font-black border ${user ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400'}`}>
                                    <div className={`w-1.5 h-1.5 rounded-full ${user ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'}`} />
                                    {user ? 'CLOUD CONNECTED' : 'OFFLINE'}
                                </div>
                            </div>
                        </nav>

                        <main className="flex-grow max-w-7xl mx-auto w-full p-6 md:p-10">
                            {activeTab === 'editor' && !viewingReport && (
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                                    <div className="lg:col-span-5 xl:col-span-4 space-y-8">
                                        <section className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200 space-y-8">
                                            <div className="flex justify-between items-center">
                                                <h3 className="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                                                    <Layout size={18} className={reportType === 'weekly' ? "text-emerald-600" : "text-indigo-600"}/> 
                                                    {reportType === 'weekly' ? "Input Laporan Mingguan" : "Input Laporan Program"}
                                                </h3>
                                                
                                                {/* NEW: Logo Upload Button */}
                                                <label className="cursor-pointer group relative">
                                                     <div className={`p-2 rounded-xl transition-all border ${reportType === 'weekly' ? 'bg-emerald-50 text-emerald-600 border-emerald-100 hover:bg-emerald-100' : 'bg-indigo-50 text-indigo-600 border-indigo-100 hover:bg-indigo-100'}`}>
                                                         <School size={18} />
                                                     </div>
                                                     <div className="absolute right-0 -top-8 bg-slate-900 text-white text-[8px] font-bold px-2 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
                                                         Tukar Logo Sekolah
                                                     </div>
                                                     <input type="file" className="hidden" accept="image/*" onChange={handleLogoUpload} />
                                                </label>
                                            </div>
                                            
                                            <div className="space-y-4">
                                                 <select name="kategori" value={formData.kategori} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-indigo-500 transition-all appearance-none cursor-pointer">
                                                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                                </select>

                                                {reportType === 'weekly' && (
                                                    <div className="space-y-4 animate-in fade-in slide-in-from-left-4">
                                                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <label className="text-[10px] font-bold uppercase text-emerald-800 block">Pilih Unit:</label>
                                                                {formData.unitNama && (
                                                                    <span className="text-[9px] font-black uppercase text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-200">
                                                                        Rekod Terdahulu: {getMeetingStats(formData.unitNama).count} | Perjumpaan Ke-{getMeetingStats(formData.unitNama).count + 1}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <select name="unitNama" value={formData.unitNama} onChange={handleInputChange} className="w-full bg-white border-2 border-emerald-200 rounded-xl p-3 text-sm font-bold outline-none focus:border-emerald-500">
                                                                {(UNIT_DATA[formData.kategori] || []).map((u, idx) => (
                                                                    <option key={idx} value={u}>{u}</option>
                                                                ))}
                                                            </select>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-4">
                                                            <input type="date" name="tarikh" value={formData.tarikh} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <select name="masaMula" value={formData.masaMula} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold outline-none appearance-none">
                                                                    <option value="">Mula</option>
                                                                    {TIME_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                                                                </select>
                                                                <select name="masaTamat" value={formData.masaTamat} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold outline-none appearance-none">
                                                                    <option value="">Tamat</option>
                                                                    {TIME_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <input type="text" name="tempat" placeholder="Tempat Perjumpaan" value={formData.tempat} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                        
                                                        {/* Single Select: Guru Penasihat */}
                                                        <div className="space-y-1">
                                                            <label className="text-[10px] font-bold uppercase text-slate-400 ml-2">Guru Penasihat</label>
                                                            <SearchableSelect 
                                                                options={GURU_LIST} 
                                                                value={formData.guruPenasihat} 
                                                                onChange={(val) => setFormData(prev => ({...prev, guruPenasihat: val}))} 
                                                                placeholder="Pilih Guru Penasihat..."
                                                            />
                                                        </div>

                                                        {/* Multi-Select: Guru Bertugas */}
                                                        <div className="space-y-1">
                                                            <label className="text-[10px] font-bold uppercase text-slate-400 ml-2">Guru Bertugas (Mingguan)</label>
                                                            <SearchableMultiSelect 
                                                                options={GURU_LIST} 
                                                                selectedValues={formData.guruBertugas} 
                                                                onChange={(vals) => setFormData(prev => ({...prev, guruBertugas: vals}))} 
                                                                placeholder="Pilih Guru Bertugas..."
                                                            />
                                                        </div>
                                                        
                                                        <div className="grid grid-cols-12 gap-3">
                                                            <div className="col-span-5">
                                                                <input type="number" name="kehadiranHadir" placeholder="Bil. Hadir" value={formData.kehadiranHadir} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                            </div>
                                                            <div className="col-span-5">
                                                                <input type="number" name="kehadiranJumlah" placeholder="Jumlah Ahli" value={formData.kehadiranJumlah} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                            </div>
                                                            <div className="col-span-2 flex items-center justify-center bg-emerald-100 border-2 border-emerald-200 rounded-2xl" title="Peratus Kehadiran">
                                                                <span className="font-black text-emerald-600 text-xs">
                                                                    {formData.kehadiranHadir && formData.kehadiranJumlah ? Math.round((formData.kehadiranHadir / formData.kehadiranJumlah) * 100) : 0}%
                                                                </span>
                                                            </div>
                                                        </div>

                                                        {formData.kategori === 'UNIT BERUNIFORM' ? (
                                                            <select name="objektif" value={formData.objektif} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500">
                                                                <option value="">Pilih Objektif Perjumpaan...</option>
                                                                {OBJEKTIF_BERUNIFORM.map((obj, idx) => (
                                                                    <option key={idx} value={obj}>{obj}</option>
                                                                ))}
                                                            </select>
                                                        ) : (
                                                            <textarea name="objektif" placeholder="B. Objektif Perjumpaan..." rows="3" value={formData.objektif} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none resize-none" />
                                                        )}
                                                        
                                                        <textarea name="kemahiranNilai" placeholder="Kemahiran / Nilai Diterapkan..." rows="2" value={formData.kemahiranNilai} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none resize-none" />
                                                        <textarea name="aktiviti" placeholder="C. Aktiviti Utama Dilaksanakan..." rows="4" value={formData.aktiviti} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none resize-none" />
                                                        <textarea name="refleksi" placeholder="G. Refleksi (Kekuatan & Penambahbaikan)..." rows="3" value={formData.refleksi} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none resize-none" />
                                                    </div>
                                                )}

                                                {reportType === 'program' && (
                                                    <div className="space-y-4 animate-in fade-in slide-in-from-right-4">
                                                        <input type="text" name="namaProgram" placeholder="Nama Program" value={formData.namaProgram} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-indigo-500" />
                                                        <input type="text" name="anjuran" placeholder="Unit Anjuran" value={formData.anjuran} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-indigo-500" />
                                                        
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <input type="date" name="tarikh" value={formData.tarikh} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                            <input type="text" name="tempat" placeholder="Tempat" value={formData.tempat} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <select name="masaMula" value={formData.masaMula} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold outline-none appearance-none">
                                                                <option value="">Masa Mula</option>
                                                                {TIME_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                                                            </select>
                                                            <select name="masaTamat" value={formData.masaTamat} onChange={handleInputChange} className="bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-xs font-bold outline-none appearance-none">
                                                                <option value="">Masa Tamat</option>
                                                                {TIME_OPTIONS.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                                                            </select>
                                                        </div>
                                                        <input type="text" name="sasaran" placeholder="Sasaran Peserta" value={formData.sasaran} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none" />
                                                        
                                                        {/* UPDATED: Objektif is now manually filled for Program Report, removed dropdown condition */}
                                                        <textarea name="objektif" placeholder="Objektif Program..." rows="2" value={formData.objektif} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500 resize-none" />

                                                        <textarea name="aktiviti" placeholder="Ringkasan Aktiviti..." rows="2" value={formData.aktiviti} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500 resize-none" />
                                                        <div className="grid grid-cols-2 gap-4">
                                                            <textarea name="kekuatan" placeholder="Kekuatan..." rows="2" value={formData.kekuatan} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-3 text-xs outline-none focus:border-indigo-500 resize-none" />
                                                            <textarea name="kelemahan" placeholder="Kelemahan..." rows="2" value={formData.kelemahan} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-3 text-xs outline-none focus:border-indigo-500 resize-none" />
                                                        </div>
                                                        <input type="text" name="disediakanOleh" placeholder="Disediakan Oleh" value={formData.disediakanOleh} onChange={handleInputChange} className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none focus:border-indigo-500" />
                                                    </div>
                                                )}

                                                <div className="grid grid-cols-2 gap-4 pt-4">
                                                    {[0,1,2,3].map(i => (
                                                        <div key={i} className="aspect-video bg-slate-100 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden group hover:border-indigo-400 transition-all">
                                                            {images[i] ? (
                                                                <>
                                                                    <img src={images[i]} className="w-full h-full object-contain bg-slate-50" />
                                                                    <button onClick={() => setImages(prev => {let n=[...prev]; n[i]=null; return n;})} className="absolute top-2 right-2 p-1.5 bg-rose-500 text-white rounded-full"><X size={10}/></button>
                                                                </>
                                                            ) : (
                                                                <label className="cursor-pointer flex flex-col items-center p-4 w-full h-full justify-center">
                                                                    <Camera size={20} className="text-slate-300" />
                                                                    <span className="text-[8px] font-black text-slate-400 mt-1 uppercase">Photo {i+1}</span>
                                                                    <input type="file" className="hidden" accept="image/*" onChange={(e) => handleImageUpload(i, e)} />
                                                                </label>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={saveReport} disabled={isSaving || !user} className="w-full bg-slate-900 hover:bg-black text-white font-black py-5 rounded-[2rem] shadow-xl transition-all flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                                                    {isSaving ? 'Processing...' : <><Cloud size={18} /> Simpan Laporan</>}
                                                </button>
                                            </div>
                                        </section>
                                    </div>
                                    <div className="lg:col-span-7 xl:col-span-8 flex flex-col items-center space-y-6">
                                        <div className="flex w-full justify-between items-center bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
                                            <h2 className="font-black text-slate-800 uppercase tracking-widest text-[11px] px-4 underline decoration-indigo-500 decoration-2">Live Preview (A4 Scale)</h2>
                                            <div className="flex gap-2">
                                                <button onClick={downloadAsJPG} disabled={isDownloading} className="bg-rose-500 hover:bg-rose-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-sm transition-all disabled:opacity-50"><Download size={16}/> JPG</button>
                                                <button onClick={() => window.print()} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-sm transition-all"><Printer size={16}/> PDF</button>
                                            </div>
                                        </div>
                                        <div className="w-full overflow-auto max-h-[85vh] scrollbar-hide p-8 bg-slate-300/40 rounded-[3rem] shadow-inner border border-slate-300/30">
                                            <ReportDocument data={{...formData, type: reportType}} reportImages={images} schoolLogo={logo} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'archive' && !viewingReport && (
                                <div className="space-y-10 animate-in fade-in slide-in-from-bottom-8 duration-700">
                                    <div className="flex flex-col xl:flex-row justify-between items-start bg-white p-8 rounded-[3rem] shadow-sm border border-slate-200 gap-8">
                                        <div className="space-y-6">
                                            <div>
                                                <h2 className="text-3xl font-black text-slate-900 tracking-tighter uppercase">Arkib Laporan</h2>
                                                <p className="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">Pengkalan Data Awan</p>
                                            </div>

                                            <div className="flex bg-slate-100 p-1.5 rounded-2xl border border-slate-200 w-fit">
                                                <button 
                                                    onClick={() => { setArchiveReportType('program'); setArchiveUnitFilter('ALL'); }} 
                                                    className={`px-6 py-3 rounded-xl text-[10px] font-black uppercase transition-all flex items-center gap-2 ${archiveReportType === 'program' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}
                                                >
                                                    <Layout size={14} /> Laporan Program (OPR)
                                                </button>
                                                <button 
                                                    onClick={() => { setArchiveReportType('weekly'); setArchiveUnitFilter('ALL'); }} 
                                                    className={`px-6 py-3 rounded-xl text-[10px] font-black uppercase transition-all flex items-center gap-2 ${archiveReportType === 'weekly' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-600'}`}
                                                >
                                                    <Layout size={14} /> Laporan Mingguan
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-col gap-4 items-center w-full xl:w-auto">
                                            <div className="flex flex-wrap justify-center bg-slate-100 p-1.5 rounded-[1.5rem] border border-slate-200">
                                                {CATEGORIES.map(cat => (
                                                    <button key={cat.id} onClick={() => {setArchiveFilter(cat.id); setArchiveUnitFilter('ALL');}} className={`flex items-center gap-2 px-6 py-3 rounded-2xl text-[10px] font-black uppercase transition-all duration-300 ${archiveFilter === cat.id ? 'bg-white text-indigo-600 shadow-md' : 'text-slate-400 hover:text-slate-600'}`}>
                                                        <cat.icon size={14} className="inline mr-1" /> {cat.label}
                                                    </button>
                                                ))}
                                            </div>

                                            <div className="w-full max-w-md">
                                                <select value={archiveUnitFilter} onChange={(e) => setArchiveUnitFilter(e.target.value)} className="w-full bg-slate-50 border border-slate-200 text-slate-500 text-xs font-bold rounded-xl p-2.5 outline-none">
                                                    <option value="ALL">Semua Unit</option>
                                                    {(UNIT_DATA[archiveFilter] || []).map((u, idx) => (
                                                        <option key={idx} value={u}>{u}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-[2.5rem] border border-slate-200 overflow-hidden shadow-sm">
                                        
                                        {archiveReportType === 'weekly' && archiveUnitFilter !== 'ALL' && (() => {
                                            const stats = getMeetingStats(archiveUnitFilter);
                                            return (
                                                <div className="bg-emerald-50 border-b border-emerald-100 p-6 flex items-center justify-between gap-6 animate-in fade-in">
                                                    <div className="flex-grow">
                                                        <div className="flex justify-between items-end mb-2">
                                                            <div>
                                                                <h4 className="text-emerald-900 font-black uppercase text-sm leading-none">{archiveUnitFilter}</h4>
                                                                <p className="text-emerald-600 text-[9px] font-bold uppercase tracking-widest mt-1">Status Aktiviti Tahunan</p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="text-xs font-black text-emerald-800">{stats.count} / 12</span>
                                                                <span className="text-[8px] font-bold text-emerald-500 uppercase block">Perjumpaan Selesai</span>
                                                            </div>
                                                        </div>
                                                        <div className="w-full bg-emerald-200 rounded-full h-3 overflow-hidden shadow-inner">
                                                            <div 
                                                                className="bg-emerald-500 h-full rounded-full transition-all duration-1000 ease-out relative" 
                                                                style={{width: `${stats.percent}%`}}
                                                            >
                                                                <div className="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9InAiIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTTAgMjBMMjAgMEgwTDIwIDIwIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0idXJsKCNwKSIvPjwvc3ZnPg==')]"></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="text-center bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm min-w-[90px]">
                                                        <span className="block text-2xl font-black text-emerald-600 leading-none">{stats.percent}%</span>
                                                        <span className="text-[7px] font-bold text-emerald-400 uppercase tracking-widest mt-1 block">Pencapaian</span>
                                                    </div>
                                                </div>
                                            );
                                        })()}

                                        <div className={`grid grid-cols-12 border-b border-slate-200 px-8 py-4 text-[10px] font-black text-white uppercase tracking-widest text-center ${archiveReportType === 'weekly' ? 'bg-emerald-600' : 'bg-indigo-600'}`}>
                                            <div className="col-span-1">Jenis</div><div className="col-span-5 text-left">{archiveReportType === 'weekly' ? 'Unit & Tarikh' : 'Nama Program & Tarikh'}</div><div className="col-span-3">Butiran</div><div className="col-span-3">Tindakan</div>
                                        </div>
                                        <div className="divide-y divide-slate-100">
                                            {(() => {
                                                const filtered = reports.filter(r => {
                                                    const rType = r.type || 'program'; 
                                                    const matchType = rType === archiveReportType;
                                                    
                                                    const matchCat = r.kategori === archiveFilter;
                                                    const matchUnit = archiveUnitFilter === 'ALL' || r.unitNama === archiveUnitFilter;
                                                    
                                                    return matchType && matchCat && matchUnit;
                                                });
                                                
                                                if (filtered.length === 0) return <div className="py-20 text-center text-slate-300 font-bold uppercase">Tiada Rekod Dijumpai</div>;

                                                return filtered.map(report => (
                                                    <div key={report.id} className="grid grid-cols-12 px-8 py-6 items-center hover:bg-slate-50 transition-all group">
                                                        <div className="col-span-1 flex justify-center">
                                                            {report.type === 'weekly' 
                                                                ? <span className="bg-emerald-100 text-emerald-600 px-2 py-1 rounded text-[8px] font-bold">MINGGUAN</span> 
                                                                : <span className="bg-indigo-100 text-indigo-600 px-2 py-1 rounded text-[8px] font-bold">PROGRAM</span>}
                                                        </div>
                                                        <div className="col-span-5">
                                                            <h4 className="font-black text-slate-800 text-sm uppercase truncate">{report.type === 'weekly' ? report.unitNama : report.namaProgram}</h4>
                                                            <p className="text-[10px] text-slate-400 font-bold uppercase">{report.tarikh}</p>
                                                        </div>
                                                        <div className="col-span-3 truncate text-[10px] font-bold text-slate-500 uppercase text-center">
                                                            {report.type === 'weekly' ? `Hadir: ${report.kehadiranHadir}/${report.kehadiranJumlah}` : report.anjuran}
                                                        </div>
                                                        <div className="col-span-3 flex justify-end gap-3">
                                                            <button onClick={() => setViewingReport(report)} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-md hover:bg-black transition-all flex items-center gap-1"><Eye size={12}/> Lihat</button>
                                                            <button onClick={() => deleteReport(report.id)} className="p-2.5 text-slate-300 hover:text-rose-500 transition-colors"><Trash2 size={18}/></button>
                                                        </div>
                                                    </div>
                                                ));
                                            })()}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {viewingReport && (
                                <div className="flex flex-col items-center space-y-10 animate-in fade-in zoom-in-95">
                                    <div className="w-full max-w-[210mm] flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-200">
                                        <button onClick={() => setViewingReport(null)} className="flex items-center gap-2 text-slate-400 hover:text-indigo-600 font-black text-[10px] uppercase tracking-widest"><ChevronLeft size={22}/> Tutup Arkib</button>
                                        <div className="flex gap-3">
                                            <button onClick={downloadAsJPG} className="bg-rose-500 text-white px-8 py-3 rounded-2xl font-black text-[10px] uppercase shadow-md"><Download size={18} className="inline mr-1" /> JPG</button>
                                            <button onClick={() => window.print()} className="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black text-[10px] uppercase shadow-md"><Printer size={18} className="inline mr-1" /> PDF</button>
                                        </div>
                                    </div>
                                    <div className="w-full overflow-x-auto pb-32 flex justify-center">
                                        <ReportDocument data={viewingReport} reportImages={viewingReport.images || []} schoolLogo={logo} />
                                    </div>
                                </div>
                            )}
                        </main>
                        <footer className="bg-slate-900 text-slate-500 py-12 text-center text-[10px] font-black uppercase border-t border-slate-800 tracking-widest">
                            <p>&copy; 2026 UNIT KO-KURIKULUM SMK MAT SALLEH RANAU</p>
                            <p className="text-[7px] mt-2 font-medium tracking-wider text-yellow-400">Developed by Mohalil</p>
                        </footer>
                    </div>
                    
                    <div id="print-area" className="screen-hidden">
                        <ReportDocument data={viewingReport || {...formData, type: reportType}} reportImages={viewingReport ? (viewingReport.images || []) : images} schoolLogo={logo} />
                    </div>
                    
                    {statusMsg && (
                        <div className={`fixed bottom-8 right-8 z-[100] flex items-center gap-4 px-8 py-5 rounded-[2rem] shadow-2xl border backdrop-blur-xl animate-in fade-in slide-in-from-right-8 ${statusMsg.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                            <span className="font-black text-sm uppercase tracking-tight">{statusMsg.text}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
